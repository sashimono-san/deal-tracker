x-runtime: &runtime
  image: ${DEAL_TRACKER_IMAGE:-deal-tracker:local}
  pull_policy: never
  build:
    context: .
    target: runtime
  env_file: .env
  environment:
    DEAL_TRACKER_DB: /data/tracker.sqlite3
    DEAL_TRACKER_PI_DIRECTORY: /pi
    DEAL_TRACKER_PI_EXECUTABLE: /usr/local/bin/pi
    DEAL_TRACKER_BROWSER_HEADLESS: ${DEAL_TRACKER_BROWSER_HEADLESS:-false}
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=128m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  web:
    <<: *runtime
    ports:
      - "127.0.0.1:${DEAL_TRACKER_PORT:-8765}:8765"
    volumes:
      - data:/data
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      start_interval: 2s
      retries: 3

  worker:
    <<: *runtime
    profiles: [job]
    entrypoint:
      - xvfb-run
      - --auto-servernum
      - --server-args=-screen 0 1280x800x24 -nolisten tcp
    command: [python, -m, deal_tracker.worker, --once]
    volumes:
      - data:/data
      - pi-config:/pi
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/chromium-seccomp.json
    mem_limit: 2g
    cpus: 2
    restart: "no"
    stop_grace_period: 150s

volumes:
  data:
  pi-config: