name: Publish release image

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ghcr-release
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - name: Check out the release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tags must use vX.Y.Z\n' >&2
            exit 1
          fi
          {
            printf 'image=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}"
            printf 'version=%s\n' "$RELEASE_TAG"
            printf 'revision=%s\n' "$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Test and lint the backend image
        run: |
          docker build --pull --target test --tag deal-tracker:release-test .
          docker run --rm --network none deal-tracker:release-test
            docker run --rm --network none deal-tracker:release-test ruff check --no-cache .

      - name: Test the sandboxed MCP browser
        run: |
          docker run --rm --init --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --security-opt "seccomp=${GITHUB_WORKSPACE}/deploy/chromium-seccomp.json" \
            --pids-limit 256 --memory 2g --cpus 2 -e HOME=/tmp \
            deal-tracker:release-test xvfb-run --auto-servernum \
            --server-args="-screen 0 1280x800x24 -nolisten tcp" \
            node --test tests/browser.test.mjs

      - name: Test and lint the frontend image
        run: |
          docker build --target frontend --tag deal-tracker:frontend-test .
          docker run --rm --network none deal-tracker:frontend-test npm test
          docker run --rm --network none deal-tracker:frontend-test npm run lint

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.verify.outputs.revision }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the runtime image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.verify.outputs.image }}:${{ needs.verify.outputs.version }}
            ${{ needs.verify.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.revision }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=release-runtime
          cache-to: type=gha,mode=max,scope=release-runtime
          provenance: mode=max
          sbom: true

      - name: Report the deployment reference
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '## Release image\n\n'
            printf 'Tag: %s:%s\n\n' "$IMAGE" "$VERSION"
            printf 'Auto-update tag: %s:latest\n\n' "$IMAGE"
            printf 'Deploy this digest:\n\n    %s@%s\n' "$IMAGE" "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"