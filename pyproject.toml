[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-tracker"
version = "0.1.0"
description = "Private buying intentions, connected searches and evidence review"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
    "urllib3>=2.6.3,<3",
    "beautifulsoup4>=4.14,<5",
    "python-dateutil>=2.9,<3",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools]
packages = ["deal_tracker"]

[tool.setuptools.package-data]
deal_tracker = ["static/*", "static/assets/*", "*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]